<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escritório Interno</title>
  <link rel="stylesheet" href="escritorio.css">
</head>
<body>

<!-- LOGIN -->
<div id="esc-login-overlay">
  <div class="esc-login-box">
    <div class="esc-login-title">Escritório Interno</div>
    <div class="esc-login-sub">JS Mentoria</div>
    <div class="esc-field">
      <label class="esc-label">E-mail</label>
      <input class="esc-input" id="esc-login-email" type="email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="esc-field">
      <label class="esc-label">Senha</label>
      <input class="esc-input" id="esc-login-senha" type="password" placeholder="••••••••">
    </div>
    <div id="esc-login-err" style="font-size:12px;color:var(--red);min-height:16px;margin-bottom:10px"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="escDoLogin()">Entrar</button>
    <div style="margin-top:14px;text-align:center">
      <a href="/" style="font-size:12px;color:var(--text3);text-decoration:none">← Sistema comercial</a>
    </div>
  </div>
</div>

<!-- NAV LATERAL -->
<nav id="esc-nav">
  <div class="esc-nav-brand">
    <div class="esc-nav-brand-name">Escritório Interno</div>
    <div class="esc-nav-brand-sub">JS Mentoria</div>
  </div>

  <div class="esc-nav-items">
    <button class="esc-nav-item active" data-modulo="escritorio" onclick="escNavegar('escritorio')">
      <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Escritório
    </button>
    <button class="esc-nav-item" data-modulo="tarefas" onclick="escNavegar('tarefas')">
      <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      Tarefas
    </button>
    <button class="esc-nav-item" data-modulo="projetos" onclick="escNavegar('projetos')">
      <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
      Projetos
    </button>
    <button class="esc-nav-item" data-modulo="agenda" onclick="escNavegar('agenda')">
      <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Agenda
    </button>
    <button class="esc-nav-item" data-modulo="conteudo" onclick="escNavegar('conteudo')">
      <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Conteúdo
    </button>
    <button class="esc-nav-item" data-modulo="equipe" onclick="escNavegar('equipe')">
      <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      Equipe
    </button>
  </div>

  <div class="esc-nav-footer">
    <div class="esc-nav-user">
      <div class="esc-nav-avatar" id="esc-nav-avatar">J</div>
      <span id="esc-nav-name" style="font-size:12px">Jéssica</span>
    </div>
    <button class="esc-nav-item" onclick="escNavegar('configuracoes')" data-modulo="configuracoes" style="margin-top:2px">
      <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Configurações
    </button>
    <button class="esc-nav-item" onclick="escLogout()" style="margin-top:2px;color:var(--text3)">
      <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sair
    </button>
    <div style="margin-top:10px">
      <a href="/" style="font-size:11px;color:var(--text3);text-decoration:none;display:flex;align-items:center;gap:6px;padding:6px 10px">
        <svg style="width:13px;height:13px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Sistema comercial
      </a>
    </div>
  </div>
</nav>

<!-- MAIN -->
<div id="esc-main">
  <header id="esc-header">
    <div class="esc-header-left">
      <div id="esc-page-title" class="esc-page-title">Escritório</div>
    </div>
    <div class="esc-header-right">
      <!-- Notificações -->
      <button class="notif-btn" onclick="notifAbrirPainel&&notifAbrirPainel()" title="Notificações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span id="notif-badge" class="notif-badge-dot"></span>
      </button>
      <!-- + Adicionar -->
      <div style="position:relative">
        <button class="btn-add" onclick="escToggleAddMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Adicionar
        </button>
        <div id="esc-add-menu" class="add-dropdown" style="display:none">
          <div class="add-dropdown-item" onclick="escAddItem('tarefa')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            Nova tarefa
          </div>
          <div class="add-dropdown-item" onclick="escAddItem('projeto')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
            Novo projeto
          </div>
          <div class="add-dropdown-item" onclick="escAddItem('reuniao')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            Nova reunião
          </div>
          <div class="add-dropdown-sep"></div>
          <div class="add-dropdown-item" onclick="escAddItem('conteudo')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Novo conteúdo
          </div>
          <div class="add-dropdown-item" onclick="escAddItem('nota')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Nota rápida
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="esc-content" style="padding:28px 28px 60px;flex:1;max-width:1100px">
    <!-- conteúdo injetado por JS -->
  </main>
</div>

<!-- MODAL -->
<div id="esc-modal-overlay">
  <div id="esc-modal-box">
    <div class="esc-modal-header">
      <div id="esc-modal-title" class="esc-modal-title">Modal</div>
      <button class="esc-modal-close" onclick="escFecharModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:18px;height:18px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="esc-modal-body"></div>
  </div>
</div>

<!-- TOAST -->
<div id="esc-toast"></div>

<!-- SCRIPTS — ordem importa -->
<script src="tarefas.js"></script>
<script src="projetos.js"></script>
<script src="reunioes.js"></script>
<script src="caixa.js"></script>
<script src="decisoes.js"></script>
<script src="planejamento.js"></script>
<script src="calendario.js"></script>
<script src="rotinas.js"></script>
<script src="equipe.js"></script>
<script src="permissoes.js"></script>
<script src="notificacoes.js"></script>
<script src="configuracoes.js"></script>
<script src="escritorio.js"></script>
</body>
</html>
